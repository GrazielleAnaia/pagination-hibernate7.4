services:
  postgres:
    image: postgres:18
    container_name: blog-postgres
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demo -d blog" ]
      interval: 5s
      timeout: 3s
      retries: 10